services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      - .env.production
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      gunicorn homefield.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --access-logfile -
      --error-logfile -
      --log-level debug
      --capture-output
    volumes:
      - media_data:/app/media
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      wait-for-rds:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    profiles: ["prod"]

  wait-for-rds:
    image: alpine:3.20
    command: sh -c "apk add --no-cache postgresql-client >/dev/null && until pg_isready -h $$DB_HOST -p $$DB_PORT; do echo waiting for db...; sleep 3; done && echo db ready && tail -f /dev/null"
    env_file:
      - .env
      - .env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $DB_HOST -p $DB_PORT"]
      interval: 10s
      timeout: 3s
      retries: 6
    profiles: ["prod"]

  # Local dev profile
  web-dev:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      - .env.development
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      gunicorn homefield.wsgi:application
      --workers 2
      --bind 0.0.0.0:8000
      --reload
      --timeout 90
      --access-logfile -
      --error-logfile -
      --log-level debug
      --capture-output
    volumes:
      - .:/app
      - media_data:/app/media
    profiles: ["dev"]

volumes:
  media_data:
